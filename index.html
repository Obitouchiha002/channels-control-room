<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#121016" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Control Room">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f5f2;--side:#efede8;--panel:#ffffff;--panel2:#f3f1ec;--ink:#1d1b18;--muted:#4f4a42;--line:#e5e1d9;
  --accent:#6d4cff;--accent2:#ece7ff;--ok:#16834a;--warn:#b26b00;--bad:#c2410c;--gold:#b8892b;--nyx:#e0a800;
  --shadow:0 1px 2px rgba(20,18,15,.04),0 8px 28px rgba(20,18,15,.06);--r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f0e12;--side:#15131a;--panel:#1a1820;--panel2:#23202a;--ink:#f2eff8;--muted:#c9c4d4;--line:#2c2833;
  --accent:#9b84ff;--accent2:#2a2440;--ok:#4ade80;--warn:#fbbf24;--bad:#fb7a4a;--gold:#e0b45c;--nyx:#ffd23f;--shadow:none}}
:root[data-theme="dark"]{--bg:#0f0e12;--side:#15131a;--panel:#1a1820;--panel2:#23202a;--ink:#f2eff8;--muted:#c9c4d4;--line:#2c2833;
  --accent:#9b84ff;--accent2:#2a2440;--ok:#4ade80;--warn:#fbbf24;--bad:#fb7a4a;--gold:#e0b45c;--nyx:#ffd23f;--shadow:none}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.55 Inter,"Noto Sans Devanagari",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}button{font:inherit;cursor:pointer;color:inherit}
[hidden]{display:none!important}
.svg{width:20px;height:20px;flex:none}
#gate{min-height:100%;display:grid;place-items:center;padding:20px}
#gate form{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px;width:min(380px,100%);box-shadow:var(--shadow)}
.brandmark{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--accent),#c44bd8);display:grid;place-items:center;color:#fff;font-weight:700;font-size:21px;margin-bottom:14px}
#gate h1{margin:0;font-size:23px}#gate p{margin:4px 0 0;color:var(--muted);font-size:16px}
.field{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);margin:18px 0 10px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:9px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
.check{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:15px;margin:10px 0 0}
#err{color:var(--bad);font-size:15px;min-height:18px;margin-top:6px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{background:var(--side);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.side .logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.side .logo .brandmark{width:36px;height:36px;font-size:16px;border-radius:10px;margin:0}
.side .logo b{font-size:17px}.side .logo span{display:block;color:var(--muted);font-size:14px}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:0;background:none;text-align:left;color:var(--muted);font-weight:500;width:100%}
.nav:hover{background:var(--panel2);color:var(--ink)}.nav.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.nav .cnt{margin-left:auto;font-size:13px;background:var(--bad);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
.side .foot{margin-top:auto;font-size:14px;color:var(--muted);padding:8px 10px}
.main{min-width:0;padding:22px 28px 40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top h1{margin:0;font-size:23px;letter-spacing:-.01em}
.top .sub{color:var(--muted);font-size:15px}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 11px;font-size:14px;color:var(--muted);text-decoration:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2s infinite;flex:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0;font-weight:600}
.card .hd{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line)}
.card .hd .more{margin-left:auto;font-size:14px;color:var(--accent);background:none;border:0}
.card .bd{padding:6px 16px 12px}
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}.kpi .n{font-size:27px;font-weight:700;letter-spacing:-.02em;line-height:1.1}.kpi .l{font-size:14px;color:var(--muted);margin-top:4px}
.kpi .n small{font-size:15px;color:var(--muted);font-weight:500}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.grid2 > *{min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.alert{border:1px solid color-mix(in srgb,var(--bad) 35%,transparent);background:color-mix(in srgb,var(--bad) 8%,var(--panel));border-radius:var(--r);padding:12px 16px;margin-bottom:16px}
.alert > b{color:var(--bad)}.alert ul{margin:6px 0 0;padding-left:18px;font-size:16px}
.okbar{border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);background:color-mix(in srgb,var(--ok) 8%,var(--panel));border-radius:var(--r);padding:10px 16px;margin-bottom:16px;color:var(--ok);font-weight:600;font-size:16px}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:11px 0;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.row .t{flex:1 1 140px;min-width:0;overflow-wrap:anywhere}.row .when{white-space:normal}
.tag{font-size:13px;font-weight:600;border-radius:7px;padding:2px 8px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.tag.short{color:var(--accent);background:var(--accent2)}.tag.long{color:var(--gold);background:color-mix(in srgb,var(--gold) 14%,transparent)}
.ch-dot{width:9px;height:9px;border-radius:50%;flex:none}.ch-nyxav{background:var(--nyx)}.ch-qirvello{background:var(--gold)}
.when{font-size:14px;color:var(--muted)}
.empty{color:var(--muted);font-size:15px;padding:10px 0}
.steps{display:flex;gap:3px;margin-top:8px}.steps i{flex:1;height:5px;border-radius:9px;background:var(--panel2)}.steps i.on{background:var(--accent)}
.ep{padding:12px 0;border-top:1px solid var(--line)}.ep:first-child{border-top:0}
.ep .meta{font-size:14px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.feed .it{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}.feed .it:first-child{border-top:0}
.feed .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--panel2);font-size:15px}
.feed .ic.error{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.feed .tx{flex:1;min-width:0}.feed .tx div{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tabs{display:flex;gap:6px;background:var(--panel2);padding:4px;border-radius:12px;width:max-content;margin-bottom:14px;max-width:100%;overflow:auto}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:9px;color:var(--muted);font-weight:500;white-space:nowrap}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.day{margin-bottom:14px}.day h3{font-size:14px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 6px}
.filter{display:flex;gap:6px;margin:0 0 12px}
.filter button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 12px;font-size:14px;color:var(--muted)}
.filter button.on{border-color:var(--accent);color:var(--accent)}
.jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.job{background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:15px}.job b{display:block}
.s-ok{color:var(--ok)}.s-bad{color:var(--bad)}.s-run{color:var(--warn)}.s-idle{color:var(--muted)}
.chan{padding:16px}.chan .hdr{display:flex;align-items:center;gap:10px;margin-bottom:12px}.chan h3{margin:0;font-size:18px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini > a,.mini > div{background:var(--panel2);border-radius:12px;padding:10px 12px;text-decoration:none}
.mini .n{font-size:21px;font-weight:700}.mini .l{font-size:14px;color:var(--muted)}

/* media */
.vrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.vrow:first-child{border-top:0}
.th16{width:112px;aspect-ratio:16/9;border-radius:10px;object-fit:cover;background:var(--panel2);flex:none}
.th9{width:56px;aspect-ratio:9/16;border-radius:9px;object-fit:cover;background:var(--panel2);flex:none}
.vinfo{flex:1;min-width:0}.vinfo .t{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vinfo .m{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.lk{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;border-radius:7px;padding:2px 7px;text-decoration:none;border:1px solid var(--line)}
.lk.yt{color:#e62117;border-color:color-mix(in srgb,#e62117 30%,transparent)}.lk.ig{color:#d62976;border-color:color-mix(in srgb,#d62976 30%,transparent)}
.lk.fb{color:#1877f2;border-color:color-mix(in srgb,#1877f2 30%,transparent)}.lk.dr{color:#1a9e5c;border-color:color-mix(in srgb,#1a9e5c 30%,transparent)}.lk.st{color:var(--muted)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.vcard{overflow:hidden;display:flex;flex-direction:column}.vcard .cov{position:relative;aspect-ratio:16/9;background:var(--panel2)}
.vcard .cov img{width:100%;height:100%;object-fit:cover}.vcard .cov.short{aspect-ratio:4/5}
.vcard .cov .badge{position:absolute;top:8px;left:8px}.vcard .cov .chl{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;border:2px solid #fff;object-fit:cover}
.vcard .vb{padding:10px 12px 12px}.vcard .vb b{font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kpi{position:relative;overflow:hidden}.kpi::after{content:"";position:absolute;inset:auto -20px -30px auto;width:90px;height:90px;border-radius:50%;background:var(--kc,var(--accent));opacity:.12}
.kpi .n{color:var(--kc,var(--ink))}
.chlogo{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;border:2px solid var(--line)}
.aig{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.aic{padding:16px}.aic .h{display:flex;align-items:center;gap:10px}.aic .h b{font-size:17px}.aic .who{font-size:14px;color:var(--muted)}
.st-b{margin-left:auto;font-size:13px;font-weight:700;border-radius:99px;padding:3px 9px}
.st-b.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}.st-b.limited{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}.st-b.down{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.aic ul{margin:10px 0 0;padding-left:18px;font-size:15px;color:var(--muted)}.aic .d{font-size:15px;margin-top:8px}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}.flow span{background:var(--panel2);border-radius:9px;padding:5px 10px}
.modal{position:fixed;inset:0;background:rgba(10,8,14,.55);z-index:20;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--panel);border-radius:20px;width:min(720px,100%);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}.modal .mh b{flex:1}
.modal .mb{padding:14px 18px;overflow:auto}.modal .mb ol{margin:0;padding-left:22px;font-size:16px;line-height:1.7}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.sc-steps{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}.sc-steps span{font-size:12.5px;border-radius:6px;padding:2px 6px;background:var(--panel2);color:var(--muted)}
.sc-steps span.y{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}.sc-steps span.n{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.state{display:inline-flex;align-items:center;gap:6px;font-size:14px;border-radius:8px;padding:3px 8px;margin-top:6px}
.state.running{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}.state.queued{color:var(--accent);background:var(--accent2)}.state.stuck{color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.state.running::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
.qa{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}.qa button{text-align:left;border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px 12px;font-size:15px}
.qa button:hover{border-color:var(--accent)}
.chatwrap{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 110px);min-height:520px;overflow:hidden}
.threads{border-right:1px solid var(--line);overflow:auto}
.threads .newb{margin:12px;width:calc(100% - 24px);justify-content:center}
.th{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 14px;border-top:1px solid var(--line)}
.th.on{background:var(--panel2)}.th b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.th span{font-size:13px;color:var(--muted)}
.conv{display:flex;flex-direction:column;min-width:0;min-height:0}
.conv .chd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.conv .chd b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msgs{flex:1;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:78%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word;font-size:16px}
.msg.owner{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:5px}
.msg.claude{align-self:flex-start;background:var(--panel2);border-bottom-left-radius:5px}
.msg .at{display:block;font-size:12px;opacity:.7;margin-top:4px}
.typing{align-self:flex-start;color:var(--muted);font-size:15px}
.composer{border-top:1px solid var(--line);padding:12px}
.chips{display:flex;gap:6px;overflow:auto;padding-bottom:8px}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:5px 12px;font-size:14px;white-space:nowrap;color:var(--muted)}
.cbox{display:flex;gap:8px;align-items:flex-end}
.cbox textarea{flex:1;min-height:46px;max-height:140px;resize:none;font:inherit;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
.note{font-size:13px;color:var(--muted);margin-top:6px}
.backth{display:none}
.mbar,.tabbar{display:none}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.grid2{grid-template-columns:1fr!important}}
@media (max-width:820px){
  .th16{width:96px}.vgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tabbar{grid-template-columns:repeat(7,1fr)!important}
  .app{grid-template-columns:1fr}.side{display:none}
  .main{padding:14px 14px calc(84px + env(safe-area-inset-bottom))}
  .mbar{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
  .mbar .brandmark{width:32px;height:32px;font-size:15px;border-radius:9px;margin:0}.mbar b{font-size:17px}.mbar .right{margin-left:auto;display:flex;gap:6px}
  .top{display:none}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;position:relative;min-width:0;white-space:nowrap;letter-spacing:-.01em}
  .tabbar button.on{color:var(--accent)}.tabbar .cnt{position:absolute;top:0;right:22%;font-size:12px;background:var(--bad);color:#fff;border-radius:99px;padding:0 5px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpi .n{font-size:23px}
  .chatwrap{grid-template-columns:1fr;height:calc(100vh - 160px)}.threads{display:none}.chatwrap.list .threads{display:block}.chatwrap.list .conv{display:none}
  .backth{display:inline-flex}.msg{max-width:88%}
}
.feed .it.new{background:color-mix(in srgb,var(--accent,#ff5a3c) 8%,transparent);border-radius:10px}.tabs.plat{margin-bottom:8px}
.stage{align-self:stretch;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--panel2);font-size:15px}
.stage b{display:block;font-weight:600}.stage span{color:var(--muted);font-size:14px}.stage i{font-style:normal;font-variant-numeric:tabular-nums}
.stage .spin{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.acct{display:flex;align-items:center;gap:8px;margin:10px 0 6px;padding:8px 10px;border-radius:12px;background:var(--panel2);font-size:14px;flex-wrap:wrap}
.use{margin:8px 0;padding:10px 12px;border-radius:12px;border:1px dashed var(--line);font-size:14px}.use b{font-size:20px}.use .rec{margin:6px 0 0;padding-left:18px;color:var(--muted);font-size:13px}
.calbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 10px}.calbar>b{margin-right:auto;font-size:17px}
.legend{color:var(--muted);font-size:13px;margin-bottom:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.cal .wh{font-size:13px;color:var(--muted);text-align:center;font-weight:600}
.cd{background:var(--panel);border:1px solid var(--line);border-radius:14px;min-height:130px;padding:8px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cd.today{border:2px solid var(--accent)}.cd.past{opacity:.6}
.cd .dn{display:flex;align-items:baseline;gap:6px}.cd .dn b{font-size:18px}.cd .dn span{font-size:12px;color:var(--muted)}
.ci{font-size:12.5px;line-height:1.35;padding:5px 7px;border-radius:9px;background:var(--panel2);cursor:pointer;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;border-left:3px solid #999}
.ci i{font-style:normal;font-weight:600;margin-right:4px}.ci.ch-nyxav{border-left-color:#f5b400}.ci.ch-qirvello{border-left-color:#c44bd8}.ci.long{background:color-mix(in srgb,var(--accent) 12%,var(--panel2))}
.fest{font-size:12px;padding:3px 6px;border-radius:8px;background:#fff3d6;color:#7a4b00}

<body>
<div id="gate"><form id="f">
  <div class="brandmark">CR</div><h1>Control Room</h1><p>Nyxav Media · Qirvello · Instagram · Facebook</p>
  <input id="pw" class="field" type="password" placeholder="Passcode" autocomplete="current-password" autofocus>
  <button class="btn primary" style="width:100%;justify-content:center">Open</button>
  <label class="check"><input type="checkbox" id="remember" checked> Is device pe yaad rakho</label><div id="err"></div>
</form></div>
<div id="app" hidden></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const REPO = 'https://github.com/Obitouchiha002/channels-autopilot';
const I = {
  home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  film:'<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 4v16M16 4v16M3 9h5M3 15h5M16 9h5M16 15h5"/>',
  chat:'<path d="M4 5h16v11H9l-5 4z"/>', grid:'<rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/>',
  cpu:'<rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  refresh:'<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>', send:'<path d="M4 12l16-8-6 16-2-7z"/>', back:'<path d="M15 5l-7 7 7 7"/>'};
const icon = (n, w) => `<svg class="svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${w ? `style="width:${w}px;height:${w}px"` : ''}>${I[n]}</svg>`;
let D = null, VIEW = 'home', TAB = 'scheduled', FILT = 'all', PLAT = 'youtube', NF = 'all', TH = 0, PW = '', LIST = false;

// live data: the `data` branch via the GitHub API (no Pages rebuild, no CDN cache; updated every 2 min), Pages copy as fallback
const DATA_API = 'https://api.github.com/repos/Obitouchiha002/channels-control-room/contents/status.enc.json?ref=data';
async function fetchData(){
  try {
    const t = (() => { try { return localStorage.getItem('gh_tok') || '' } catch (x) { return '' } })();
    const r = await fetch(DATA_API + '&t=' + Date.now(), {cache:'no-store', headers: Object.assign({'Accept':'application/vnd.github.raw+json'}, t ? {'Authorization':'Bearer ' + t} : {})});
    if (r.ok) return await r.json();
  } catch (x) {}
  return await (await fetch('status.enc.json?' + Date.now(), {cache:'no-store'})).json();
}
async function decrypt(pw){
  const e = await fetchData();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(e.salt), iterations:200000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(e.iv)}, key, b64(e.ct))));
}
const chKey = n => /nyx/i.test(n) ? 'nyxav' : /tech/i.test(n) ? 'techbyvansh' : /itih|gumn/i.test(n) ? 'itihaas' : 'qirvello';
const allAlerts = () => D.channels.flatMap(c => c.alerts.map(a => ({ch:c.name, a})));
const sum = f => D.channels.reduce((t, c) => t + (+f(c) || 0), 0);
const jobCls = s => s === 'ok' ? 's-ok' : s.startsWith('failed') ? 's-bad' : (s === 'running' || s.startsWith('AI limit')) ? 's-run' : 's-idle';
const STEPS = ['research','script','factcheck','plan','visuals','voice','render','qa','seo','benchmark','upload'];

function kpis(){
  const soc = k => sum(c => (c.social || {})[k]?.followers);
  return `<div class="kpis">
   <div class="card kpi" style="--kc:var(--ok)"><div class="n">${sum(c => c.counts?.live)}</div><div class="l">🟢 Live videos</div></div>
   <div class="card kpi" style="--kc:var(--accent)"><div class="n">${sum(c => c.counts?.scheduled)}</div><div class="l">📅 Scheduled</div></div>
   <div class="card kpi" style="--kc:var(--warn)"><div class="n">${sum(c => c.counts?.making)}</div><div class="l">🛠️ Ban rahe hain</div></div>
   <div class="card kpi" style="--kc:#e62117"><div class="n">${sum(c => c.stats?.subscriberCount)}</div><div class="l">YouTube subscribers</div></div>
   <div class="card kpi" style="--kc:#ff5a3c"><div class="n">${sum(c => c.stats?.viewCount)}</div><div class="l">YouTube views</div></div>
   <div class="card kpi" style="--kc:#d62976"><div class="n">${soc('instagram')}<small> / ${soc('facebook')}</small></div><div class="l">Instagram / Facebook</div></div></div>`;
}
const chObj = n => D.channels.find(c => c.name === n) || {};
const links = (u, c) => `${u.id ? `<a class="lk yt" href="https://youtu.be/${esc(u.id)}" target="_blank" rel="noopener">▶ YouTube</a><a class="lk st" href="https://studio.youtube.com/video/${esc(u.id)}/edit" target="_blank" rel="noopener">Studio</a>` : ''}${(u.links || {}).instagram ? `<a class="lk ig" href="${esc(u.links.instagram)}" target="_blank" rel="noopener">Instagram</a>` : ''}${(u.links || {}).facebook ? `<a class="lk fb" href="${esc(u.links.facebook)}" target="_blank" rel="noopener">Facebook</a>` : ''}${(u.links || {}).drive ? `<a class="lk dr" href="${esc(u.links.drive)}" target="_blank" rel="noopener">Drive</a>` : ''}`;
const img = (src, cls) => src ? `<img class="${cls}" src="${esc(src)}" loading="lazy" alt="" onerror="this.style.visibility='hidden'">` : `<div class="${cls}"></div>`;
const vRow = (u, c) => `<div class="vrow" data-det="${esc(c)}|${esc(u.ep || '')}|${esc(u.id || '')}" style="cursor:pointer">${img(u.thumb, u.kind === 'short' ? 'th9' : 'th16')}<div class="vinfo"><span class="t">${esc(u.title)}</span>
  <div class="m"><span class="ch-dot ch-${chKey(c)}"></span><span class="tag ${u.kind}">${u.kind === 'short' ? 'Short' : 'Long'}</span><span class="when">${dt(u.when, u.when_ist)}${u.took ? ` · ⏱ ${esc(u.took)}` : ''}</span>${links(u, c)}</div></div></div>`;
const vCard = u => { const c = chObj(u.ch); return `<div class="card vcard" data-det="${esc(u.ch)}|${esc(u.ep || '')}|${esc(u.id || '')}" style="cursor:pointer"><div class="cov ${u.kind}">${img(u.thumb, '')}<span class="tag ${u.kind} badge">${u.kind === 'short' ? 'Short' : 'Long'}</span>${c.logo ? `<img class="chl" src="${esc(c.logo)}" alt="">` : ''}</div>
  <div class="vb"><b>${esc(u.title)}</b><div class="when" style="margin:4px 0 6px">${u.postedAt ? '📤 ' + dt(u.postedAt) : dt(u.when, u.when_ist)}${u.took ? `<br>⏱ ${esc(u.took)} mein bana` : ''}</div><div class="m" style="display:flex;gap:5px;flex-wrap:wrap">${links(u, u.ch)}</div></div></div>`; };
const vRowOld = (u, c) => `<div class="row"><span class="ch-dot ch-${chKey(c)}" title="${esc(c)}"></span><span class="tag ${u.kind}">${u.kind === 'short' ? 'Short' : 'Long'}</span>
  <span class="t">${u.id ? `<a href="https://studio.youtube.com/video/${esc(u.id)}/edit" target="_blank" rel="noopener">${esc(u.title)}</a>` : esc(u.title)}</span><span class="when">${esc(u.when_ist)}</span></div>`;
const upcoming = () => D.channels.flatMap(c => c.upcoming.map(u => ({...u, ch:c.name}))).sort((a, b) => a.when < b.when ? -1 : 1);
const liveList = () => D.channels.flatMap(c => (c.live || []).map(u => ({...u, ch:c.name}))).sort((a, b) => (a.when || '') < (b.when || '') ? 1 : -1);
const making = () => D.channels.flatMap(c => c.episodes.map(e => ({...e, ch:c.name})));
const feedHtml = n => (D.activity || []).slice(0, n).map(f => `<div class="it"><div class="ic ${f.kind}">${f.kind === 'error' ? '⚠️' : f.kind === 'job' ? '⚙️' : '✨'}</div>
  <div class="tx"><div>${esc(f.text)}</div><span class="when">${dt(f.at, f.at_h)} · ${esc(f.ch)}</span></div></div>`).join('') || '<div class="empty">Abhi koi activity nahi</div>';
const epHtml = e => { const i = Math.max(0, STEPS.indexOf(e.stage));
  return `<div class="ep" style="display:flex;gap:12px">${e.thumb ? img(e.thumb, e.kind === 'short' ? 'th9' : 'th16') : ''}<div style="flex:1;min-width:0"><div class="row" style="padding:0;border:0"><span class="ch-dot ch-${chKey(e.ch)}"></span><span class="tag ${e.kind}">${e.kind === 'short' ? 'Short' : 'Long'}</span><span class="t">${esc(e.title)}</span><span class="when">${esc(e.stage)}</span></div>
  ${e.kind === 'long' ? `<div class="steps">${STEPS.map((_, k) => `<i class="${k <= i ? 'on' : ''}"></i>`).join('')}</div>` : ''}${e.state && e.state.text ? `<div class="state ${e.state.s}">${esc(e.state.text)}${e.state.eta ? ` · <b>${e.state.s === 'running' ? 'ETA' : 'Agla run'}: ${esc(e.state.eta)}</b>` : ''}</div>` : ''}${e.note ? `<div class="meta">${esc(e.note)}</div>` : ''}</div></div>`; };

function home(){
  const al = allAlerts();
  return `${al.length ? `<div class="alert"><b>Dhyaan dein (${al.length})</b><ul>${al.map(x => `<li><b>${esc(x.ch)}:</b> ${esc(x.a)}</li>`).join('')}</ul></div>` : '<div class="okbar">✓ Sab theek chal raha hai</div>'}
  ${kpis()}
  <div class="grid2"><div class="stack">
    <div class="card"><div class="hd"><h2>📅 Aage kya live hoga</h2><button class="more" data-go="content" data-tab="calendar">🗓️ Calendar →</button></div><div class="bd">${upcoming().slice(0, 6).map(u => vRow(u, u.ch)).join('') || '<div class="empty">Kuch scheduled nahi</div>'}</div></div>
    <div class="card"><div class="hd"><h2>🛠️ Abhi ban raha hai</h2><button class="more" data-go="content" data-tab="making">Sab dekho →</button></div><div class="bd">${making().slice(0, 5).map(epHtml).join('') || '<div class="empty">Workshop khaali</div>'}</div></div>
  </div><div class="stack">
    <div class="card"><div class="hd"><h2>⚡ Quick actions</h2></div><div class="bd" style="padding-top:12px"><div class="qa">${[
      ['🎬 Aaj ke Shorts abhi banao','Dono channels ke agle Shorts abhi bana ke schedule kar do (jo ready hain).'],
      ['⏸ Qirvello Shorts 1 din roko','Qirvello ke Shorts aaj ke liye rok do, kal se wapas.'],
      ['🧠 AI → sirf Codex','runner.json mein brain = codex kar do (Claude ko skip karo) aur bata do.'],
      ['🧠 AI → Auto','runner.json mein brain = auto kar do (pehle Claude, phir Codex).'],
      ['📊 Is hafte ki report','Dono channels ki is hafte ki short report do: views, best video, kya sudhaarein.'],
      ['🛠️ Problem dhoondo + fix','Tester chalao, koi problem ho to developer agent se theek karwao aur batao.']
    ].map(([l, c]) => `<button data-cmd="${esc(c)}">${l}</button>`).join('')}</div></div></div>
    <div class="card"><div class="hd"><span class="dot"></span><h2>Live activity</h2><button class="more" data-go="system">Poori →</button></div><div class="bd feed">${feedHtml(10)}</div></div>
    <div class="card"><div class="hd"><h2>🟢 Haal hi mein live</h2><button class="more" data-go="content" data-tab="live">Sab →</button></div><div class="bd">${liveList().slice(0, 4).map(u => vRow(u, u.ch)).join('') || '<div class="empty">Abhi kuch live nahi</div>'}</div></div>
  </div></div>`;
}
function content(){
  if (TAB === 'scripts') return scriptsTab();
  if (TAB === 'calendar' && PLAT === 'youtube') return tabsBar() + calendar();
  if (PLAT !== 'youtube') return platTab();
  const list = TAB === 'scheduled' ? upcoming() : TAB === 'live' ? liveList() : making();
  const f = list.filter(x => FILT === 'all' || chKey(x.ch) === FILT);
  let body = '';
  if (TAB === 'making') body = f.map(epHtml).join('');
  else { const days = {}; f.forEach(u => { const d = (u.when_ist || 'Live').split(',')[0]; (days[d] = days[d] || []).push(u); });
    body = Object.entries(days).map(([d, us]) => `<div class="day"><h3>${esc(d)}</h3><div class="vgrid">${us.map(vCard).join('')}</div></div>`).join(''); }
  const n = k => k === 'scheduled' ? upcoming().length : k === 'live' ? liveList().length : k === 'scripts' ? lib().length : making().length;
  return tabsBar() + `${body ? (TAB === 'making' ? `<div class="card"><div class="bd">${body}</div></div>` : body) : '<div class="card"><div class="bd"><div class="empty">Kuch nahi mila</div></div></div>'}`;
}
const lib = () => D.channels.flatMap(c => (c.library || []).map(x => ({...x, ch:c.name})));
const tabsBar = () => { const n = k => k === 'calendar' ? upcoming().length : k === 'scheduled' ? upcoming().length : k === 'live' ? liveList().length : k === 'scripts' ? lib().length : making().length;
  return platBar() + (PLAT !== 'youtube' ? '' : `<div class="tabs">${[['calendar','🗓️ Calendar'],['scheduled','📅 Scheduled'],['live','🟢 Live'],['making','🛠️ Ban raha hai'],['scripts','📚 Scripts']].map(([k, l]) => `<button data-tab="${k}" class="${TAB === k ? 'on' : ''}">${l} (${n(k)})</button>`).join('')}</div>
   <div class="filter">${[['all','Sab'],['qirvello','Qirvello'],['itihaas','Itihaas'],['nyxav','Nyxav']].map(([k, l]) => `<button data-f="${k}" class="${FILT === k ? 'on' : ''}">${l}</button>`).join('')}</div>`); };
const platBar = () => `<div class="plat3">${[['youtube','▶ YouTube'],['instagram','📸 Instagram'],['facebook','📘 Facebook']].map(([k, l]) => `<button data-plat="${k}" class="${PLAT === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
const allItems = () => upcoming().concat(liveList());
function platTab(){
  const xs = allItems().filter(u => (u.links || {})[PLAT]).sort((a, b) => ((b.posted || {})[PLAT] || '') < ((a.posted || {})[PLAT] || '') ? -1 : 1);
  const acc = D.channels.map(c => (c.social || {})[PLAT] ? `<a class="card acc" href="${esc(c.social[PLAT].url)}" target="_blank" rel="noopener">${c.logo ? `<img src="${esc(c.logo)}" alt="">` : ''}<div class="ai"><b>${esc(c.social[PLAT].handle)}</b><span>${esc(c.name)} · profile kholo ↗</span></div>
      <div class="st"><b>${c.social[PLAT].followers ?? 0}</b><span>Followers</span></div>${c.social[PLAT].posts != null ? `<div class="st"><b>${c.social[PLAT].posts}</b><span>Posts</span></div>` : ''}</a>` : '').join('');
  return platBar() + `<div class="stack" style="margin-bottom:14px;gap:10px">${acc || '<div class="card"><div class="bd"><div class="empty">Account abhi juda nahi</div></div></div>'}</div>
    <div class="day"><h3>${PLAT === 'instagram' ? 'Reels' : 'Page Reels'} (${xs.length})</h3><div class="vgrid">${xs.map(u => vCard({...u, postedAt: (u.posted || {})[PLAT] || ''})).join('') || '<div class="empty">Abhi kuch post nahi hua</div>'}</div></div>`;
}
function detail(ch, ep, id){
  const u = allItems().find(x => x.ch === ch && (id ? x.id === id : x.ep === ep)); if (!u) return;
  const live = u.when && new Date(u.when) <= new Date(), p = u.posted || {}, L = u.links || {};
  const row = (k, v) => v ? `<div class="row"><span class="t">${k}</span><span class="when">${esc(v)}</span></div>` : '';
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="box"><div class="mh"><span class="ch-dot ch-${chKey(ch)}"></span><b>${esc(u.title)}</b><button class="btn" data-close style="padding:6px 10px">✕</button></div>
    <div class="mb"><div style="display:flex;gap:14px;flex-wrap:wrap">${img(u.thumb, u.kind === 'short' ? 'th9' : 'th16')}<div style="flex:1;min-width:220px">
    ${row('Channel', ch)}${row('Type', u.kind === 'short' ? 'Short / Reel' : 'Long video')}
    ${row('▶ YouTube', (live ? '🟢 Live — ' : '📅 Scheduled — ') + (fmtDT(u.when) || u.when_ist || ''))}${row('📸 Instagram', p.instagram ? '✅ ' + fmtDT(p.instagram) : (L.instagram ? '✅' : '—  abhi nahi'))}
    ${row('📘 Facebook', p.facebook ? '✅ ' + fmtDT(p.facebook) : (L.facebook ? '✅' : '—  abhi nahi'))}${row('⏱ Banne mein', u.took)}${row('Folder', u.ep)}</div></div></div>
    ${u.cover ? `<div class="mb" style="padding-top:0"><div class="acct" style="display:block;line-height:1.6">🖼️ <b>Cover</b> — Instagram par purana/kaala cover ho to: neeche se cover save karo → Instagram app → Reel → ⋯ → <b>Edit</b> → <b>Edit cover</b> → <b>Add from camera roll</b> → ye image → Done.<br><a class="btn primary" href="${esc(u.cover)}" download="${esc(u.ep)}-cover.jpg" target="_blank" rel="noopener" style="margin-top:8px">⬇ Cover save karo</a></div></div>` : ''}
    <div class="mf">${links(u, ch)}</div></div>`;
  m.addEventListener('click', e => { if (e.target === m || e.target.closest('[data-close]')) m.remove(); }); document.body.appendChild(m);
}
// ---- send a task/setting to Claude from anywhere (in-app chat when connected)
async function sendCmd(t, quiet){
  if (!TOK()) { window.open(REPO + '/issues/new?labels=command&title=' + encodeURIComponent(t.slice(0, 80)) + '&body=' + encodeURIComponent(t), '_blank'); return; }

// ---- 🗓️ content calendar: 4 weeks, every Long/Short on its day + festivals + empty slots to fill
let CALW = 0, CALK = 'all';
const ymd = d => d.toLocaleDateString('en-CA', {timeZone:'Asia/Kolkata'});
function calendar(){
  const today = new Date(), mon = new Date(today); mon.setDate(today.getDate() - ((today.getDay() + 6) % 7) + CALW * 7);
  const items = allItems().filter(u => u.when && (FILT === 'all' || chKey(u.ch) === FILT) && (CALK === 'all' || u.kind === CALK));
  const byDay = {}; items.forEach(u => (byDay[ymd(new Date(u.when))] = byDay[ymd(new Date(u.when))] || []).push(u));
  const fest = d => (D.festivals || []).filter(f => f.date <= d && d <= f.end);
  const days = [...Array(28)].map((_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; });
  const t = ymd(today);
  const cell = d => { const k = ymd(d), us = (byDay[k] || []).sort((a, b) => a.when < b.when ? -1 : 1), fs = fest(k);
    const qLong = d.getDay() % 7 === 0 || d.getDay() === 3 || d.getDay() === 5;  // Qirvello long: Sun/Wed/Fri
    const gaps = k < t ? [] : [].concat(
      (FILT === 'all' || FILT === 'qirvello') && CALK !== 'short' && qLong && !us.some(u => u.ch === 'Qirvello' && u.kind === 'long') ? [['Qirvello', 'Long']] : [],
      ...D.channels.filter(c => FILT === 'all' || chKey(c.name) === FILT).map(c => { const need = (us.some(u => u.ch === c.name && u.kind === 'long') ? 1 : 2) - us.filter(u => u.ch === c.name && u.kind === 'short').length; return CALK !== 'long' && need > 0 ? [[c.name, `${need} Short`]] : []; }));
    return `<div class="cd ${k === t ? 'today' : ''} ${k < t ? 'past' : ''}"><div class="dn"><b>${d.getDate()}</b><span>${d.toLocaleDateString('hi-IN', {weekday:'short'})}</span></div>
      ${fs.map(f => `<div class="fest">🪔 ${esc(f.hi || f.name)}</div>`).join('')}
      ${us.map(u => `<div class="ci ${u.kind} ch-${chKey(u.ch)}" data-det="${esc(u.ch)}|${esc(u.ep || '')}|${esc(u.id || '')}"><i>${new Date(u.when).toLocaleTimeString('en-IN', {timeZone:'Asia/Kolkata', hour:'numeric', minute:'2-digit'})}</i>${u.kind === 'short' ? '▮' : '▬'} ${esc(u.title.split('#')[0].slice(0, 38))}${(u.links || {}).instagram ? ' 📸' : ''}${(u.links || {}).facebook ? ' 📘' : ''}</div>`).join('')}
      ${gaps.map(([c, w]) => `<button class="gap" data-scmd="${esc(`${c}: ${k} ke liye ${w} banao aur schedule karo (khaali slot)`)}">＋ ${esc(c.split(' ')[0])} ${esc(w)}</button>`).join('')}</div>`; };
  const from = days[0].toLocaleDateString('en-IN', {day:'numeric', month:'short'}), to = days[27].toLocaleDateString('en-IN', {day:'numeric', month:'short'});
  return `<div class="calbar"><button class="btn" data-cal="-1">‹</button><button class="btn" data-cal="0">Aaj</button><button class="btn" data-cal="1">›</button><b>${from} – ${to}</b>
     <div class="filter" style="margin:0">${[['all','Sab'],['long','▬ Long'],['short','▮ Shorts']].map(([k, l]) => `<button data-calk="${k}" class="${CALK === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
   <div class="legend"><span class="ch-dot ch-nyxav"></span>Nyxav <span class="ch-dot ch-qirvello"></span>Qirvello · 🪔 tyohaar · 📸 IG · 📘 FB · <span class="gap" style="display:inline">＋ khaali slot</span> dabao = Claude bana dega</div>
   <div class="cal">${['Som','Mangal','Budh','Guru','Shukra','Shani','Ravi'].map(w => `<div class="wh">${w}</div>`).join('')}${days.map(cell).join('')}</div>`;
}
function system(){
  const r = D.runner || {};
  return `<div class="stack"><div class="card"><div class="hd"><h2>System</h2></div><div class="bd"><div class="row"><span class="t">Kahan chal raha hai</span><span class="pill">${esc(r.runner || 'mac')}</span></div>
     <div class="row"><span class="t">AI</span><span class="pill">${({claude:'Sirf Claude', auto:'Claude → Codex', codex:'Sirf Codex'})[r.brain] || esc(r.brain)}</span></div><div class="row"><span class="t">Last update</span><span class="when">${esc(D.generated)}</span></div></div></div>
   ${D.channels.map(c => `<div class="card"><div class="hd"><span class="ch-dot ch-${chKey(c.name)}"></span><h2>${esc(c.name)} — automatic jobs</h2></div><div class="bd" style="padding-top:12px"><div class="jobs">${c.jobs.map(j => `<div class="job"><b>${esc(j.job)}</b><span class="${jobCls(j.status)}">${esc(j.status)}</span><div class="when">${esc(j.last || '')}</div></div>`).join('')}</div></div></div>`).join('')}
   <div class="card"><div class="hd"><span class="dot"></span><h2>Poori activity</h2></div><div class="bd feed">${feedHtml(40)}</div></div></div>`;

I.ai = '<path d="M12 3l2.2 5.3L20 9l-4.4 3.8L17 18l-5-3-5 3 1.4-5.2L4 9l5.8-.7z"/>';

const VIEWS = {home:['Overview','home'], content:['Content','film'], chat:['Chat','chat'], analytics:['Analytics','chart'], ai:['AI','ai'], channels:['Channels','grid'], system:['Settings','cpu'], inbox:['Notifications','bell']};
function render(){
  const al = allAlerts().length, title = VIEWS[VIEW][0];
  const bell = sz => `<button class="btn bellb" data-go="inbox" style="padding:6px 8px;position:relative" title="Notifications">${icon('bell', sz)}${unread() ? `<span class="cnt" style="position:absolute;top:-5px;right:-5px">${unread()}</span>` : ''}</button>`;
  const nav = cls => Object.entries(VIEWS).filter(([k]) => k !== 'inbox').map(([k, [l, ic]]) => `<button class="${cls} ${VIEW === k ? 'on' : ''}" data-go="${k}">${icon(ic)}<span>${l}</span>${k === 'system' && al ? `<span class="cnt">${al}</span>` : ''}${k === 'ai' && (D.ai || []).some(a => a.status !== 'ok') ? `<span class="cnt" style="background:var(--warn)">${(D.ai || []).filter(a => a.status !== 'ok').length}</span>` : ''}</button>`).join('');
  $('#app').innerHTML = `<div class="app"><aside class="side"><div class="logo"><div class="brandmark">CR</div><div><b>Control Room</b><span>3 channels · YouTube · IG · FB</span></div></div>${nav('nav')}
      <div class="foot">Updated ${esc(D.generated)}</div></aside>
    <div style="min-width:0"><div class="mbar"><div class="brandmark">CR</div><b>${title}</b><div class="right">${bell(18)}<button class="btn" data-act="refresh" style="padding:6px 8px">${icon('refresh', 18)}</button><button class="btn" data-act="theme" style="padding:6px 8px">${icon('sun', 18)}</button></div></div>
    <main class="main"><div class="top"><div><h1>${title}</h1><div class="sub">Updated ${esc(D.generated)} · har 10 min</div></div><div class="right"><span class="pill"><span class="dot"></span>Live</span>${bell(16)}
      <button class="btn" data-act="refresh">${icon('refresh', 16)} Refresh</button><button class="btn" data-act="theme">${icon('sun', 16)}</button></div></div>
    ${({home, content, chat, analytics, ai, channels, system: settings, inbox})[VIEW]()}</main></div></div><nav class="tabbar">${nav('')}</nav>`;
  const m = $('#msgs'); if (m) m.scrollTop = m.scrollHeight;
}
function toast(t){ const n = document.createElement('div'); n.textContent = t; n.style.cssText = 'position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;z-index:9;max-width:90%'; document.body.appendChild(n); setTimeout(() => n.remove(), 3500); }
document.addEventListener('click', e => {
  const op = !e.target.closest('a') && e.target.closest('[data-open]'); if (op) { op.classList.toggle('open'); return; }
  const dt = !e.target.closest('a') && e.target.closest('[data-det]'); if (dt) { const [c, ep, id] = dt.dataset.det.split('|'); detail(c, ep, id); return; }
  const sb = e.target.closest('[data-scmd]'); if (sb) { document.querySelector('.modal')?.remove(); sendCmd(sb.dataset.scmd); return; }
  const sc = e.target.closest('[data-script]'); if (sc) { const [ch, id] = sc.dataset.script.split('|'); openScript(ch, id); return; }
  const b = e.target.closest('button'); if (!b || b.form) return;
  if (b.dataset.go) { VIEW = b.dataset.go; if (b.dataset.tab) TAB = b.dataset.tab; LIST = VIEW === 'chat' && innerWidth <= 820 && !CH.cur; chatPoll(VIEW === 'chat'); render(); scrollTo(0, 0); return; }
  if (b.dataset.tab) { TAB = b.dataset.tab; render(); return; }
  if (b.dataset.f) { FILT = b.dataset.f; render(); return; }
  if (b.dataset.cal) { CALW = b.dataset.cal === '0' ? 0 : CALW + +b.dataset.cal; render(); return; }
  if (b.dataset.calk) { CALK = b.dataset.calk; render(); return; }
  if (b.dataset.acct) { acctModal(b.dataset.acct); return; }
  if (b.dataset.plat) { PLAT = b.dataset.plat; render(); return; }
  if (b.dataset.nf) { NF = b.dataset.nf; render(); return; }
  if (b.dataset.set) { const [k, v] = b.dataset.set.split('='); if (!TOK()) { toast('Pehle Chat jodo (Settings → Chat connection)'); return; }
    sendCmd(`⚙️ set ${k}=${v}`, true); return; }
  if (b.dataset.act === 'untok') { try { localStorage.removeItem('gh_tok') } catch (x) {} chatPoll(false); render(); return; }
  if (b.dataset.act === 'logout') { try { localStorage.removeItem('cr_pw'); sessionStorage.removeItem('cr_pw') } catch (x) {} location.reload(); return; }
  if (b.dataset.th) { TH = +b.dataset.th; LIST = false; render(); return; }
  if (b.dataset.thn) { CH.cur = +b.dataset.thn; CH.msgs = []; LIST = false; chatLoad(); return; }
  if (b.id === 'toksave') { const v = $('#tokin').value.trim(); if (!v) return; try { localStorage.setItem('gh_tok', v) } catch (x) {} CH.threads = null; render(); chatPoll(true); return; }
  if (b.id === 'backth') { LIST = true; render(); return; }
  if (b.id === 'newchat') { TH = -1; CH.cur = null; CH.msgs = []; LIST = false; render(); $('#ctext')?.focus(); return; }
  if (b.dataset.cmd && TOK()) { sendCmd(b.dataset.cmd); return; }
  if (b.dataset.cmd) { window.open(REPO + '/issues/new?labels=command&title=' + encodeURIComponent(b.dataset.cmd.slice(0, 80)) + '&body=' + encodeURIComponent(b.dataset.cmd), '_blank'); toast('GitHub pe Submit dabao — Claude 1–2 min mein kar dega'); return; }
  if (b.dataset.q) { const t = $('#ctext'); t.value = b.dataset.q; t.focus(); return; }
  if (b.id === 'csend') { if (TOK()) { chatSend(); return; } const txt = $('#ctext').value.trim(); if (!txt) return;
    window.open(REPO + '/issues/new?labels=command&title=' + encodeURIComponent(txt.slice(0, 80)) + '&body=' + encodeURIComponent(txt), '_blank'); return; }
  if (b.dataset.act === 'refresh') { load(true); return; }
  if (b.dataset.act === 'theme') { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; try { localStorage.setItem('theme', t) } catch (x) {} }
});
document.addEventListener('keydown', e => { if (e.target.id === 'ctext' && e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#csend')?.click(); } });
async function load(say){ try {
  D = await decrypt(PW);
  // never wipe what the owner is doing: chat has its own live poll; skip while typing or a popup is open
  const busy = VIEW === 'chat' || document.querySelector('.modal') || ['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName);
  if (!busy || say) { const y = scrollY; render(); scrollTo(0, y); }
  if (say) toast('Updated ✓'); } catch (e) {} }
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t } catch (e) {}
async function start(pw, remember){
  D = await decrypt(pw); PW = pw;
  try { if (remember) localStorage.setItem('cr_pw', pw); else sessionStorage.setItem('cr_pw', pw) } catch (e) {}
  $('#gate').hidden = true; $('#app').hidden = false; render();
  setInterval(load, 30 * 1000); document.addEventListener('visibilitychange', () => { if (!document.hidden) load() });
}
$('#f').onsubmit = async ev => { ev.preventDefault(); $('#err').textContent = '';
  try { await start($('#pw').value.trim(), $('#remember').checked) } catch (e) { $('#err').textContent = 'Galat passcode — dobara try karein' } };
try { const pw = localStorage.getItem('cr_pw') || sessionStorage.getItem('cr_pw'); if (pw) start(pw, false).catch(() => { try { localStorage.removeItem('cr_pw') } catch (x) {} }) } catch (e) {}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
